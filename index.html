<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#f6f7fb">
<title>English Course</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#172033;--muted:#687386;--accent:#4f46e5;--accent2:#eef2ff;--line:#e6e9ef;--ok:#16794a;--okbg:#ecfdf3;--bad:#b42318;--badbg:#fef3f2;--warn:#9a6700;--warnbg:#fff8c5;--shadow:0 8px 28px rgba(20,27,45,.06)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit}button{touch-action:manipulation}.app{max-width:940px;margin:0 auto;padding:18px 16px 110px}
.topbar{position:sticky;top:0;z-index:30;margin:-18px -16px 12px;padding:18px 16px 12px;background:rgba(246,247,251,.94);backdrop-filter:blur(14px);border-bottom:1px solid rgba(230,233,239,.9)}
.brandrow,.lessonhead,.qtop,.sectiontitle{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand h1{font-size:1.35rem;margin:0}.brand p,.muted{color:var(--muted);font-size:.9rem}.brand p{margin:2px 0 0}
.iconbtn,.backbtn{border:0;background:#fff;border-radius:12px;width:42px;height:42px;box-shadow:var(--shadow);cursor:pointer}.hero,.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);margin:12px 0}
.hero{background:linear-gradient(135deg,#fff,#f0f2ff);border-color:#e1e5ff}.eyebrow{font-size:.78rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}.hero h2{margin:7px 0}.hero p{margin:0;color:var(--muted)}
.progressline{height:9px;background:#e9ecf3;border-radius:999px;overflow:hidden;margin:14px 0 8px}.progressfill{height:100%;width:0;background:var(--accent);border-radius:inherit;transition:.25s}.progressmeta{display:flex;justify-content:space-between;font-size:.84rem;color:var(--muted)}
.primary,.secondary,.ghost,.danger{border:0;border-radius:12px;padding:12px 15px;font-weight:750;cursor:pointer}.primary{background:var(--accent);color:#fff}.secondary{background:var(--accent2);color:#3730a3}.ghost{background:#f1f3f6;color:#344054}.danger{background:#fff1f0;color:#b42318}.full{width:100%}.sectiontitle{align-items:end;margin:22px 2px 10px}.sectiontitle h3{margin:0}.sectiontitle span{font-size:.85rem;color:var(--muted)}
.days{display:grid;grid-template-columns:1fr;gap:10px}.daycard{border:1px solid #d7dcff;background:#fff;border-radius:16px;padding:14px;display:flex;align-items:center;gap:13px;box-shadow:0 3px 14px rgba(20,27,45,.035);cursor:pointer}.daynum{width:44px;height:44px;flex:0 0 44px;border-radius:13px;background:var(--accent2);display:flex;align-items:center;justify-content:center;font-weight:850;color:var(--accent)}.dayinfo{min-width:0;flex:1}.dayinfo h4{margin:0 0 3px;font-size:1rem}.dayinfo p{margin:0;color:var(--muted);font-size:.82rem}.badge{font-size:.72rem;font-weight:800;padding:5px 8px;border-radius:999px;white-space:nowrap}.badge.available{background:#eef2ff;color:#4338ca}.badge.done{background:var(--okbg);color:var(--ok)}
.view{display:none}.view.active{display:block}.lessonhead{align-items:flex-start;justify-content:flex-start;margin:10px 0 14px}.lessonhead h2{margin:0;font-size:1.3rem}.lessonhead p{margin:3px 0 0;color:var(--muted);font-size:.88rem}.repeatwrap{margin-left:auto}.repeatbtn{white-space:nowrap}
.tabbar{display:flex;gap:8px;overflow:auto;padding:2px 0 8px;scrollbar-width:none}.tabbar::-webkit-scrollbar{display:none}.tab{border:1px solid var(--line);background:#fff;color:#475467;border-radius:999px;padding:9px 13px;white-space:nowrap;font-weight:750;cursor:pointer}.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.card h3{margin:0 0 6px}.question{padding:15px 0;border-bottom:1px solid var(--line)}.question:last-child{border-bottom:0}.qtop{align-items:flex-start}.qnum{font-weight:850}.qstatus{font-size:.72rem;font-weight:850;padding:5px 7px;border-radius:999px;background:#f2f4f7;color:#667085;white-space:nowrap}.qstatus.ok{background:var(--okbg);color:var(--ok)}.qstatus.bad{background:var(--badbg);color:var(--bad)}
.options{display:grid;gap:8px;margin-top:10px}.option{display:flex;gap:9px;align-items:flex-start;border:1px solid #d9dde5;border-radius:12px;padding:10px 12px;cursor:pointer;background:#fff}.option:hover{border-color:#aeb5ff}.option.selected{border-color:var(--accent);background:#f5f6ff}.option input{width:auto;margin:2px 0 0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.explain{margin-top:10px;padding:12px;border-radius:12px;background:#f8f9fc;border:1px solid var(--line);font-size:.9rem;line-height:1.5}.explain.ok{background:var(--okbg);border-color:#b7e4cc}.explain.bad{background:var(--badbg);border-color:#f5c5c0}.explain b{display:block;margin-bottom:3px}.tr{margin-top:6px;color:#475467}.passage{background:#f8f9fc;border-left:4px solid var(--accent);border-radius:12px;padding:14px;margin:12px 0 4px}.passage p{line-height:1.65}.vocabgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.vocab{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fafbfc}.vocab b{display:block}
textarea{width:100%;border:1px solid #d5d9e2;border-radius:12px;padding:12px;margin-top:9px;min-height:90px;font-size:16px}.notice{border:1px solid #d7dcff;background:#f5f6ff;border-radius:14px;padding:14px;color:#3730a3}
.statsgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;text-align:center}.stat b{font-size:1.35rem;display:block}.stat span{font-size:.78rem;color:var(--muted)}
.bottomnav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;z-index:40;width:min(940px,100%);padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:rgba(246,247,251,.94);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;gap:8px}.navbtn{flex:1;border:0;background:transparent;border-radius:12px;padding:10px 8px;color:#667085;font-size:.82rem;font-weight:750;cursor:pointer}.navbtn.active{background:#fff;color:var(--accent)}.hidden{display:none!important}.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(20px);background:#172033;color:#fff;padding:11px 14px;border-radius:999px;font-size:.86rem;opacity:0;pointer-events:none;transition:.2s;z-index:80;max-width:90%;text-align:center}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(min-width:640px){.days{grid-template-columns:1fr 1fr}.vocabgrid{grid-template-columns:repeat(3,1fr)}}@media(max-width:560px){.lessonhead{flex-wrap:wrap}.repeatwrap{width:100%;margin-left:52px}.repeatbtn{width:100%}.statsgrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<div class="topbar"><div class="brandrow"><div class="brand"><h1 id="courseTitle">English Course</h1><p id="courseSubtitle"></p></div><button class="iconbtn" id="settingsBtn">⚙️</button></div></div>
<main>
<section id="homeView" class="view active">
<div class="hero"><div class="eyebrow">Çalışmaya devam et</div><h2 id="heroTitle"></h2><p id="heroSub"></p><div class="progressline"><div class="progressfill" id="heroProgress"></div></div><div class="progressmeta"><span id="heroProgressText"></span><span id="heroDuration"></span></div><button class="primary full" id="continueBtn" style="margin-top:14px">Derse başla</button></div>
<div class="sectiontitle"><h3>30 Günlük Program</h3><span id="overallText"></span></div><div class="days" id="daysGrid"></div>
</section>

<section id="lessonView" class="view">
<div class="lessonhead"><button class="backbtn" id="backBtn">‹</button><div><h2 id="lessonTitle"></h2><p id="lessonMeta"></p></div><div class="repeatwrap"><button class="danger repeatbtn" id="repeatDayBtn">↻ Eğitimi Tekrarla</button></div></div>
<div class="tabbar">
<button class="tab active" data-tab="review">Review</button><button class="tab" data-tab="grammar">Grammar</button><button class="tab" data-tab="vocabulary">Vocabulary</button><button class="tab" data-tab="reading">Reading</button><button class="tab" data-tab="speaking">Speaking</button><button class="tab" data-tab="result">Sonuç</button>
</div>
<div id="tabReview" class="tabcontent"></div><div id="tabGrammar" class="tabcontent hidden"></div><div id="tabVocabulary" class="tabcontent hidden"></div><div id="tabReading" class="tabcontent hidden"></div><div id="tabSpeaking" class="tabcontent hidden"></div><div id="tabResult" class="tabcontent hidden"></div>
</section>

<section id="progressView" class="view"><div class="sectiontitle"><h3>İlerleme</h3><span>Cihazında kayıtlı</span></div><div class="statsgrid"><div class="stat"><b id="statDays">0</b><span>Tamamlanan gün</span></div><div class="stat"><b id="statReview">0</b><span>Review doğru</span></div><div class="stat"><b id="statGrammar">0</b><span>Grammar doğru</span></div></div></section>
<section id="settingsView" class="view"><div class="sectiontitle"><h3>Ayarlar</h3><span>English Course</span></div><div class="card"><h3>İlerleme verisi</h3><p class="muted">Bu işlem 30 günün tüm cevaplarını siler.</p><button class="danger" id="resetBtn">Tüm ilerlemeyi sıfırla</button></div></section>
</main></div>
<nav class="bottomnav"><button class="navbtn active" data-view="homeView">🏠<br>Ana Sayfa</button><button class="navbtn" data-view="progressView">📈<br>İlerleme</button><button class="navbtn" data-view="settingsView">⚙️<br>Ayarlar</button></nav>
<div class="toast" id="toast"></div>
<script src="course-data.js"></script>
<script>
(()=>{
"use strict";
const DATA=window.ENGLISH_COURSE_DATA;
if(!DATA||!Array.isArray(DATA.days)){document.body.innerHTML="<div style='padding:30px;font-family:sans-serif'>course-data.js yüklenemedi. İki dosyanın aynı klasörde olduğundan emin olun.</div>";return;}
const STORAGE_KEY="english_course_progress_v1";
let progress={days:{}},currentDay=DATA.days[0];
const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s));
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(progress))}
function load(){try{const r=localStorage.getItem(STORAGE_KEY);if(r)progress=JSON.parse(r)}catch(e){}if(!progress.days)progress.days={}}
function dayState(id){if(!progress.days[id])progress.days[id]={review:{},grammar:{},reading:{}};const s=progress.days[id];s.review=s.review||{};s.grammar=s.grammar||{};s.reading=s.reading||{};return s}
function toast(m){const e=$("#toast");e.textContent=m;e.classList.add("show");clearTimeout(window.__t);window.__t=setTimeout(()=>e.classList.remove("show"),1800)}
function sectionDone(day,key){const qs=day.sections[key]?.questions||[],st=dayState(day.id)[key]||{};return qs.filter(q=>st[q.id]?.completed).length}
function lessonProgress(day){const keys=["review","grammar","reading"],tot=keys.reduce((n,k)=>n+(day.sections[k]?.questions?.length||0),0);if(!tot)return 0;const done=keys.reduce((n,k)=>n+sectionDone(day,k),0);return Math.round(done/tot*100)}
function isDayDone(day){return lessonProgress(day)===100}
function overall(){return Math.round(DATA.days.reduce((a,d)=>a+lessonProgress(d),0)/DATA.days.length)}
function showView(id){$$(".view").forEach(v=>v.classList.toggle("active",v.id===id));$$(".navbtn").forEach(b=>b.classList.toggle("active",b.dataset.view===id));window.scrollTo({top:0,behavior:"smooth"});if(id==="homeView")renderHome();if(id==="progressView")renderProgress()}
function renderHome(){
 const active=DATA.days.find(d=>!isDayDone(d))||DATA.days[0];currentDay=active;const p=lessonProgress(active);
 $("#heroTitle").textContent=`Day ${active.number} — ${active.shortTitle}`;$("#heroSub").textContent=active.focus;$("#heroDuration").textContent=active.duration;$("#heroProgress").style.width=p+"%";$("#heroProgressText").textContent=p+"% tamamlandı";$("#continueBtn").textContent=p?"Derse devam et":"Derse başla";$("#overallText").textContent=overall()+"%";
 const g=$("#daysGrid");g.innerHTML="";DATA.days.forEach(day=>{const d=document.createElement("div");const done=isDayDone(day);d.className="daycard";d.innerHTML=`<div class="daynum">${day.number}</div><div class="dayinfo"><h4>${day.shortTitle}</h4><p>${day.focus} • ${day.duration}</p></div><span class="badge ${done?"done":"available"}">${done?"Tamamlandı":"Açık"}</span>`;d.addEventListener("click",()=>openLesson(day));g.appendChild(d)})
}
function openLesson(day){currentDay=day;$("#lessonTitle").textContent=`Day ${day.number} — ${day.title}`;$("#lessonMeta").textContent=`${day.duration} • ${day.focus}`;renderAll();showView("lessonView");switchTab("review")}
function switchTab(name){$$(".tab").forEach(t=>t.classList.toggle("active",t.dataset.tab===name));["Review","Grammar","Vocabulary","Reading","Speaking","Result"].forEach(n=>$("#tab"+n).classList.toggle("hidden",n.toLowerCase()!==name));if(name==="result")renderResult()}
function choiceSection(key,target){
 const sec=currentDay.sections[key],st=dayState(currentDay.id)[key],box=$(target);box.innerHTML=`<div class="card"><h3>${sec.title}</h3><p class="muted">${sec.intro}</p><div class="qlist"></div></div>`;const list=box.querySelector(".qlist");
 sec.questions.forEach((q,i)=>{const item=st[q.id]||{answer:null,completed:false,correct:null};const el=document.createElement("div");el.className="question";const options=q.options.map((o,idx)=>`<label class="option ${item.answer===idx?"selected":""}"><input type="radio" name="${q.id}" value="${idx}" ${item.answer===idx?"checked":""} ${item.completed?"disabled":""}><span><b>${String.fromCharCode(65+idx)})</b> ${o}</span></label>`).join("");let fb="";if(item.completed){const ans=q.options[q.correct];fb=`<div class="explain ${item.correct?"ok":"bad"}"><b>${item.correct?"Doğru ✓":"Yanlış ✗"} — Doğru cevap: ${String.fromCharCode(65+q.correct)}) ${ans}</b><div><strong>Neden?</strong> ${q.explanation}</div><div class="tr"><strong>Türkçesi:</strong> ${q.translation}</div></div>`}
 el.innerHTML=`<div class="qtop"><div><span class="qnum">${i+1}.</span> ${q.text}</div><span class="qstatus ${item.completed?(item.correct?"ok":"bad"):""}">${item.completed?(item.correct?"Doğru":"Yanlış"):"Bekliyor"}</span></div><div class="options">${options}</div><div class="actions"><button class="secondary check ${item.completed?"hidden":""}" data-id="${q.id}">Kontrol et</button><button class="ghost edit ${item.completed?"":"hidden"}" data-id="${q.id}">Tekrar cevapla</button></div>${fb}`;list.appendChild(el)});
 box.querySelectorAll("input[type=radio]").forEach(r=>r.addEventListener("change",e=>{const qid=e.target.name;st[qid]={answer:Number(e.target.value),completed:false,correct:null};save();choiceSection(key,target)}));
 box.querySelectorAll(".check").forEach(b=>b.addEventListener("click",()=>{const q=sec.questions.find(x=>x.id===b.dataset.id),x=st[q.id];if(!x||x.answer===null){toast("Önce bir seçenek seç.");return}x.completed=true;x.correct=x.answer===q.correct;save();choiceSection(key,target);renderHome()}));
 box.querySelectorAll(".edit").forEach(b=>b.addEventListener("click",()=>{const x=st[b.dataset.id]||{};x.completed=false;x.correct=null;st[b.dataset.id]=x;save();choiceSection(key,target)}));
}
function renderReview(){choiceSection("review","#tabReview")}function renderGrammar(){choiceSection("grammar","#tabGrammar")}
function renderVocabulary(){const s=currentDay.sections.vocabulary;$("#tabVocabulary").innerHTML=`<div class="card"><h3>${s.title}</h3><p class="muted">${s.intro}</p><div class="vocabgrid">${s.words.map(w=>`<div class="vocab"><b>${w.en}</b><span>${w.tr}</span></div>`).join("")}</div></div>`}
function renderReading(){const s=currentDay.sections.reading,st=dayState(currentDay.id).reading;$("#tabReading").innerHTML=`<div class="card"><h3>${s.title}</h3><p class="muted">${s.intro}</p><div class="passage"><h4>${s.passageTitle}</h4>${s.passage.map(p=>`<p>${p}</p>`).join("")}</div><div class="readlist"></div></div>`;const list=$("#tabReading .readlist");s.questions.forEach((q,i)=>{const x=st[q.id]||{answer:"",completed:false};const el=document.createElement("div");el.className="question";el.innerHTML=`<div><span class="qnum">${i+1}.</span> ${q.text}</div><textarea id="${q.id}" ${x.completed?"disabled":""}>${escapeHtml(x.answer||"")}</textarea><div class="actions"><button class="primary readsave ${x.completed?"hidden":""}" data-id="${q.id}">Cevabı kaydet</button><button class="ghost readedit ${x.completed?"":"hidden"}" data-id="${q.id}">Tekrar cevapla</button></div>${x.completed?`<div class="explain ok"><b>Örnek / beklenen cevap</b><div>${q.model}</div><div><strong>Neden?</strong> ${q.explanation}</div><div class="tr"><strong>Türkçesi:</strong> ${q.translation}</div></div>`:""}`;list.appendChild(el)});$("#tabReading").querySelectorAll(".readsave").forEach(b=>b.addEventListener("click",()=>{const ta=document.getElementById(b.dataset.id),v=ta.value.trim();if(!v){toast("Önce cevabını yaz.");return}st[b.dataset.id]={answer:v,completed:true};save();renderReading();renderHome()}));$("#tabReading").querySelectorAll(".readedit").forEach(b=>b.addEventListener("click",()=>{const x=st[b.dataset.id]||{};st[b.dataset.id]={answer:x.answer||"",completed:false};save();renderReading()}));s.questions.forEach(q=>{const ta=document.getElementById(q.id);if(ta&&!ta.disabled)ta.addEventListener("input",e=>{st[q.id]={answer:e.target.value,completed:false};save()})})}
function renderSpeaking(){const s=currentDay.sections.speaking;$("#tabSpeaking").innerHTML=`<div class="card"><h3>${s.title}</h3><p class="muted">${s.intro}</p><div class="notice"><b>ChatGPT'ye gönder:</b><br><br>${s.prompt}</div><button class="primary full" id="copySpeaking" style="margin-top:12px">Speaking mesajını kopyala</button></div>`;$("#copySpeaking").addEventListener("click",async()=>{await copyText(s.prompt);toast("Speaking mesajı kopyalandı.")})}
function renderResult(){const st=dayState(currentDay.id),r=currentDay.sections.review.questions,g=currentDay.sections.grammar.questions,rr=currentDay.sections.reading.questions;const rd=r.filter(q=>st.review[q.id]?.completed).length,rc=r.filter(q=>st.review[q.id]?.correct).length,gd=g.filter(q=>st.grammar[q.id]?.completed).length,gc=g.filter(q=>st.grammar[q.id]?.correct).length,read=rr.filter(q=>st.reading[q.id]?.completed).length;$("#tabResult").innerHTML=`<div class="card"><h3>Day ${currentDay.number} sonucu</h3><p class="muted">Review: <b>${rc}/${rd}</b> • Grammar: <b>${gc}/${gd}</b> • Reading: <b>${read}/${rr.length}</b></p><div class="progressline"><div class="progressfill" style="width:${lessonProgress(currentDay)}%"></div></div><p class="muted">${lessonProgress(currentDay)}% tamamlandı</p></div>`}
function renderAll(){renderReview();renderGrammar();renderVocabulary();renderReading();renderSpeaking();renderResult()}
function renderProgress(){let d=0,r=0,g=0;DATA.days.forEach(day=>{if(isDayDone(day))d++;const s=dayState(day.id);r+=Object.values(s.review).filter(x=>x.correct).length;g+=Object.values(s.grammar).filter(x=>x.correct).length});$("#statDays").textContent=d;$("#statReview").textContent=r;$("#statGrammar").textContent=g}
function resetCurrentDay(){if(!confirm(`Day ${currentDay.number} için verdiğin tüm cevaplar silinsin ve eğitim baştan başlasın mı?`))return;delete progress.days[currentDay.id];save();renderAll();renderHome();renderProgress();switchTab("review");toast(`Day ${currentDay.number} sıfırlandı.`)}
async function copyText(t){try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();document.execCommand("copy");a.remove()}}
function escapeHtml(s){return(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}
$("#courseTitle").textContent=DATA.courseTitle;$("#courseSubtitle").textContent=DATA.subtitle;$("#continueBtn").addEventListener("click",()=>openLesson(currentDay));$("#backBtn").addEventListener("click",()=>showView("homeView"));$("#settingsBtn").addEventListener("click",()=>showView("settingsView"));$("#repeatDayBtn").addEventListener("click",resetCurrentDay);$$(".navbtn").forEach(b=>b.addEventListener("click",()=>showView(b.dataset.view)));$$(".tab").forEach(t=>t.addEventListener("click",()=>switchTab(t.dataset.tab)));$("#resetBtn").addEventListener("click",()=>{if(confirm("30 günün tüm kayıtlı cevapları ve ilerlemesi silinsin mi?")){localStorage.removeItem(STORAGE_KEY);progress={days:{}};renderHome();renderProgress();toast("Tüm ilerleme sıfırlandı.")}});
load();renderHome();renderProgress();
})();
</script>
</body>
</html>
