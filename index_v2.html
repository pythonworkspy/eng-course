<style>

</head>

</main></div>

function toast(m){const e=$("#toast");e.textContent=m;e.classList.add("show");clearTimeout(window.__t);window.__t=setTimeout(()=>e.classList.remove("show"),1800)}
function sectionDone(day,key){const qs=day.sections[key]?.questions||[],st=dayState(day.id)[key]||{};return qs.filter(q=>st[q.id]?.completed).length}
function lessonProgress(day){
 const st=dayState(day.id);
 const reviewQs=day.sections.review?.questions||[],grammarQs=day.sections.grammar?.questions||[],readQs=day.sections.reading?.questions||[],vocab=day.sections.vocabulary?.words||[];
 const total=reviewQs.length+grammarQs.length+readQs.length+vocab.length;if(!total)return 0;

 return Math.round(done/total*100)
}

 const active=DATA.days.find(d=>!isDayDone(d))||DATA.days[0];currentDay=active;const p=lessonProgress(active);
 $("#heroTitle").textContent=`Day ${active.number} — ${active.shortTitle}`;$("#heroSub").textContent=active.focus;$("#heroDuration").textContent=active.duration;$("#heroProgress").style.width=p+"%";$("#heroProgressText").textContent=p+"% tamamlandı";$("#continueBtn").textContent=p?"Derse devam et":"Derse başla";$("#overallText").textContent=overall()+"%";
 const g=$("#daysGrid");g.innerHTML="";DATA.days.forEach(day=>{const d=document.createElement("div");const done=isDayDone(day);d.className="daycard";d.innerHTML=`<div class="daynum">${day.number}</div><div class="dayinfo"><h4>${day.shortTitle}</h4><p>${day.focus} • ${day.duration}</p></div><span class="badge ${done?"done":"available"}">${done?"Tamamlandı":"Açık"}</span>`;d.addEventListener("click",()=>openLesson(day));g.appendChild(d)})
}
function openLesson(day){currentDay=day;$("#lessonTitle").textContent=`Day ${day.number} — ${day.title}`;$("#lessonMeta").textContent=`${day.duration} • ${day.focus}`;renderAll();showView("lessonView");switchTab("review")}
function switchTab(name){$$(".tab").forEach(t=>t.classList.toggle("active",t.dataset.tab===name));["Review","Grammar","Vocabulary","Reading","Speaking","Result"].forEach(n=>$("#tab"+n).classList.toggle("hidden",n.toLowerCase()!==name));if(name==="result")renderResult()}
function choiceSection(key,target){
 const sec=currentDay.sections[key],st=dayState(currentDay.id)[key],box=$(target);box.innerHTML=`<div class="card"><h3>${sec.title}</h3><p class="muted">${sec.intro}</p><div class="qlist"></div></div>`;const list=box.querySelector(".qlist");
 sec.questions.forEach((q,i)=>{const item=st[q.id]||{answer:null,completed:false,correct:null};const el=document.createElement("div");el.className="question";const options=q.options.map((o,idx)=>`<label class="option ${item.answer===idx?"selected":""}"><input type="radio" name="${q.id}" value="${idx}" ${item.answer===idx?"checked":""} ${item.completed?"disabled":""}><span><b>${String.fromCharCode(65+idx)})</b> ${o}</span></label>`).join("");let fb="";if(item.completed){const ans=q.options[q.correct];fb=`<div class="explain ${item.correct?"ok":"bad"}"><b>${item.correct?"Doğru ✓":"Yanlış ✗"} — Doğru cevap: ${String.fromCharCode(65+q.correct)}) ${ans}</b><div><strong>Neden?</strong> ${q.explanation}</div><div class="tr"><strong>Türkçesi:</strong> ${q.translation}</div></div>`}
 el.innerHTML=`<div class="qtop"><div><span class="qnum">${i+1}.</span> ${q.text}</div><span class="qstatus ${item.completed?(item.correct?"ok":"bad"):""}">${item.completed?(item.correct?"Doğru":"Yanlış"):"Bekliyor"}</span></div><div class="options">${options}</div><div class="actions"><button class="secondary check ${item.completed?"hidden":""}" data-id="${q.id}">Kontrol et</button><button class="ghost edit ${item.completed?"":"hidden"}" data-id="${q.id}">Tekrar cevapla</button></div>${fb}`;list.appendChild(el)});
 box.querySelectorAll("input[type=radio]").forEach(r=>r.addEventListener("change",e=>{const qid=e.target.name;st[qid]={answer:Number(e.target.value),completed:false,correct:null};save();choiceSection(key,target)}));
 box.querySelectorAll(".check").forEach(b=>b.addEventListener("click",()=>{const q=sec.questions.find(x=>x.id===b.dataset.id),x=st[q.id];if(!x||x.answer===null){toast("Önce bir seçenek seç.");return}x.completed=true;x.correct=x.answer===q.correct;save();choiceSection(key,target);renderHome()}));
 box.querySelectorAll(".edit").forEach(b=>b.addEventListener("click",()=>{const x=st[b.dataset.id]||{};x.completed=false;x.correct=null;st[b.dataset.id]=x;save();choiceSection(key,target)}));
}
function renderReview(){choiceSection("review","#tabReview")}function renderGrammar(){choiceSection("grammar","#tabGrammar")}
function normTr(s){return(s||"").trim().toLocaleLowerCase("tr-TR").replace(/[ıİ]/g,"i").replace(/ş/g,"s").replace(/ğ/g,"g").replace(/ü/g,"u").replace(/ö/g,"o").replace(/ç/g,"c").replace(/[^a-z0-9\s]/g," ").replace(/\s+/g," ").trim()}
function renderVocabulary(){
 const s=currentDay.sections.vocabulary,st=dayState(currentDay.id).vocabulary;
 $("#tabVocabulary").innerHTML=`<div class="card"><h3>${s.title}</h3><p class="muted">${s.intro}</p><div class="vocablist"></div></div>`;
 const list=$("#tabVocabulary .vocablist");
 s.words.forEach((w,i)=>{const x=st[w.id]||{answer:"",completed:false,correct:null};const el=document.createElement("div");el.className="vocabitem";let fb="";if(x.completed){fb=`<div class="explain ${x.correct?"ok":"bad"}"><b>${x.correct?"Doğru ✓":"Yanlış ✗"} — Doğru anlam: ${w.tr}</b><div><strong>Açıklama:</strong> ${w.explanation}</div></div>`}el.innerHTML=`<div class="qtop"><div><span class="qnum">${i+1}.</span> <span class="vocabword">${w.en}</span></div><span class="qstatus ${x.completed?(x.correct?"ok":"bad"):""}">${x.completed?(x.correct?"Doğru":"Yanlış"):"Bekliyor"}</span></div><div class="vocabwork"><div class="vocabexample"><strong>English example:</strong><br>${w.example}</div><div><input class="vocabanswer" id="${w.id}" value="${escapeHtml(x.answer||"")}" placeholder="Türkçe anlamını yaz..." ${x.completed?"disabled":""}><div class="actions"><button class="secondary vocabcheck ${x.completed?"hidden":""}" data-id="${w.id}">Kontrol et</button><button class="ghost vocabedit ${x.completed?"":"hidden"}" data-id="${w.id}">Tekrar cevapla</button></div></div></div>${fb}`;list.appendChild(el)});
 $("#tabVocabulary").querySelectorAll(".vocabcheck").forEach(b=>b.addEventListener("click",()=>{const w=s.words.find(x=>x.id===b.dataset.id),inp=document.getElementById(w.id),val=inp.value.trim();if(!val){toast("Önce Türkçe anlamını yaz.");inp.focus();return}const accepted=(w.answers||[w.tr]).map(normTr);const correct=accepted.includes(normTr(val));st[w.id]={answer:val,completed:true,correct};save();renderVocabulary();renderHome()}));
 $("#tabVocabulary").querySelectorAll(".vocabedit").forEach(b=>b.addEventListener("click",()=>{const x=st[b.dataset.id]||{};st[b.dataset.id]={answer:x.answer||"",completed:false,correct:null};save();renderVocabulary();setTimeout(()=>document.getElementById(b.dataset.id)?.focus(),30)}));
 s.words.forEach(w=>{const inp=document.getElementById(w.id);if(inp&&!inp.disabled)inp.addEventListener("input",e=>{st[w.id]={answer:e.target.value,completed:false,correct:null};save()})})
}
function renderReading(){const s=currentDay.sections.reading,st=dayState(currentDay.id).reading;$("#tabReading").innerHTML=`<div class="card"><h3>${s.title}</h3><p class="muted">${s.intro}</p><div class="passage"><h4>${s.passageTitle}</h4>${s.passage.map(p=>`<p>${p}</p>`).join("")}</div><div class="readlist"></div></div>`;const list=$("#tabReading .readlist");s.questions.forEach((q,i)=>{const x=st[q.id]||{answer:"",completed:false};const el=document.createElement("div");el.className="question";el.innerHTML=`<div><span class="qnum">${i+1}.</span> ${q.text}</div><textarea id="${q.id}" ${x.completed?"disabled":""}>${escapeHtml(x.answer||"")}</textarea><div class="actions"><button class="primary readsave ${x.completed?"hidden":""}" data-id="${q.id}">Cevabı kaydet</button><button class="ghost readedit ${x.completed?"":"hidden"}" data-id="${q.id}">Tekrar cevapla</button></div>${x.completed?`<div class="explain ok"><b>Örnek / beklenen cevap</b><div>${q.model}</div><div><strong>Neden?</strong> ${q.explanation}</div><div class="tr"><strong>Türkçesi:</strong> ${q.translation}</div></div>`:""}`;list.appendChild(el)});$("#tabReading").querySelectorAll(".readsave").forEach(b=>b.addEventListener("click",()=>{const ta=document.getElementById(b.dataset.id),v=ta.value.trim();if(!v){toast("Önce cevabını yaz.");return}st[b.dataset.id]={answer:v,completed:true};save();renderReading();renderHome()}));$("#tabReading").querySelectorAll(".readedit").forEach(b=>b.addEventListener("click",()=>{const x=st[b.dataset.id]||{};st[b.dataset.id]={answer:x.answer||"",completed:false};save();renderReading()}));s.questions.forEach(q=>{const ta=document.getElementById(q.id);if(ta&&!ta.disabled)ta.addEventListener("input",e=>{st[q.id]={answer:e.target.value,completed:false};save()})})}
function renderSpeaking(){const s=currentDay.sections.speaking;$("#tabSpeaking").innerHTML=`<div class="card"><h3>${s.title}</h3><p class="muted">${s.intro}</p><div class="notice"><b>ChatGPT'ye gönder:</b><br><br>${s.prompt}</div><button class="primary full" id="copySpeaking" style="margin-top:12px">Speaking mesajını kopyala</button></div>`;$("#copySpeaking").addEventListener("click",async()=>{await copyText(s.prompt);toast("Speaking mesajı kopyalandı.")})}
function renderResult(){const st=dayState(currentDay.id),r=currentDay.sections.review.questions,g=currentDay.sections.grammar.questions,v=currentDay.sections.vocabulary.words,rr=currentDay.sections.reading.questions;const rd=r.filter(q=>st.review[q.id]?.completed).length,rc=r.filter(q=>st.review[q.id]?.correct).length,gd=g.filter(q=>st.grammar[q.id]?.completed).length,gc=g.filter(q=>st.grammar[q.id]?.correct).length,vd=v.filter(w=>st.vocabulary[w.id]?.completed).length,vc=v.filter(w=>st.vocabulary[w.id]?.correct).length,read=rr.filter(q=>st.reading[q.id]?.completed).length;$("#tabResult").innerHTML=`<div class="card"><h3>Day ${currentDay.number} sonucu</h3><p class="muted">Review: <b>${rc}/${rd}</b> • Grammar: <b>${gc}/${gd}</b> • Vocabulary: <b>${vc}/${vd}</b> • Reading: <b>${read}/${rr.length}</b></p><div class="progressline"><div class="progressfill" style="width:${lessonProgress(currentDay)}%"></div></div><p class="muted">${lessonProgress(currentDay)}% tamamlandı</p></div>`}
function renderAll(){renderReview();renderGrammar();renderVocabulary();renderReading();renderSpeaking();renderResult()}
function renderProgress(){let d=0,r=0,g=0,v=0;DATA.days.forEach(day=>{if(isDayDone(day))d++;const s=dayState(day.id);r+=Object.values(s.review).filter(x=>x.correct).length;g+=Object.values(s.grammar).filter(x=>x.correct).length;v+=Object.values(s.vocabulary).filter(x=>x.correct).length});$("#statDays").textContent=d;$("#statReview").textContent=r;$("#statGrammar").textContent=g;$("#statVocab").textContent=v}
function resetCurrentDay(){if(!confirm(`Day ${currentDay.number} için verdiğin tüm cevaplar silinsin ve eğitim baştan başlasın mı?`))return;delete progress.days[currentDay.id];save();renderAll();renderHome();renderProgress();switchTab("review");toast(`Day ${currentDay.number} sıfırlandı.`)}
async function copyText(t){try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();document.execCommand("copy");a.remove()}}
function escapeHtml(s){return(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}
$("#courseTitle").textContent=DATA.courseTitle;$("#courseSubtitle").textContent=DATA.subtitle;$("#continueBtn").addEventListener("click",()=>openLesson(currentDay));$("#backBtn").addEventListener("click",()=>showView("homeView"));$("#settingsBtn").addEventListener("click",()=>showView("settingsView"));$("#repeatDayBtn").addEventListener("click",resetCurrentDay);$$(".navbtn").forEach(b=>b.addEventListener("click",()=>showView(b.dataset.view)));$$(".tab").forEach(t=>t.addEventListener("click",()=>switchTab(t.dataset.tab)));$("#resetBtn").addEventListener("click",()=>{if(confirm("30 günün tüm kayıtlı cevapları ve ilerlemesi silinsin mi?")){localStorage.removeItem(STORAGE_KEY);progress={days:{}};renderHome();renderProgress();toast("Tüm ilerleme sıfırlandı.")}});
load();renderHome();renderProgress();
})();
</script>
</body>
</html>
